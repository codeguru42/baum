name: baum-tournament
region: nyc

services:
  - name: backend
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: REPO_PLACEHOLDER/backend
      tag: latest
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: tournament_app.settings
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        scope: RUN_TIME
        type: SECRET
    health_check:
      http_path: /api/players/
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api

  - name: web
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: REPO_PLACEHOLDER/frontend
      tag: latest
    envs:
      - key: VITE_API_URL
        value: ${APP_URL}/api
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
