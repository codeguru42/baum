services:
  backend:
    image: ${BACKEND_IMAGE:-tournament-backend-prod}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tournament-backend-prod
    restart: always
    expose:
      - "8000"
    volumes:
      - backend-data:/app/db
      - static-files:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=tournament_app.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DATABASE_URL=sqlite:///db/db.sqlite3
    networks:
      - tournament-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-tournament-frontend-prod}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: tournament-frontend-prod
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - tournament-network

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: tournament-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static-files:/static:ro
      - ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tournament-network

networks:
  tournament-network:
    driver: bridge

volumes:
  backend-data:
  static-files:
  ssl-certs:
