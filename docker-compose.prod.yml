services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/codeguru42/baum/backend:latest}
    pull_policy: always
    container_name: tournament-backend-prod
    restart: always
    expose:
      - "8000"
    volumes:
      - backend-data:/app/db
      - static-files:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=tournament_app.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    networks:
      - tournament-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/codeguru42/baum/frontend:latest}
    pull_policy: always
    container_name: tournament-frontend-prod
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - tournament-network

networks:
  tournament-network:
    driver: bridge

volumes:
  backend-data:
  static-files:
