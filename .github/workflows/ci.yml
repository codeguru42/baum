name: CI

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend development image
      run: |
        docker build -t baum-vibe-backend-dev:test -f backend/Dockerfile backend/
    
    - name: Run Django tests with pytest
      run: |
        docker run --rm baum-vibe-backend-dev:test uv run pytest -v --cov --cov-report=term-missing
    
    - name: Run ruff linting
      run: |
        docker run --rm baum-vibe-backend-dev:test uv run ruff check .
      continue-on-error: true  # Advisory
    
    - name: Check black formatting
      run: |
        docker run --rm baum-vibe-backend-dev:test uv run black --check .
      continue-on-error: true  # Advisory
    
    - name: Run mypy type checking
      run: |
        docker run --rm baum-vibe-backend-dev:test uv run mypy .
      continue-on-error: true  # Advisory

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build frontend development image
      run: |
        docker build -t baum-vibe-frontend-dev:test -f frontend/Dockerfile frontend/
    
    - name: Run tests in container
      run: |
        docker run --rm -e CI=true baum-vibe-frontend-dev:test npm test -- --watchAll=false --coverage
    
    - name: Build frontend in container
      run: |
        docker run --rm baum-vibe-frontend-dev:test npm run build

  docker-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Only run if triggered by workflow_run and build was successful
    # Skip for pull requests since images may not be available
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull backend image from GHCR
      run: |
        echo "Pulling backend image from GHCR..."
        docker pull ghcr.io/${{ github.repository }}/backend:latest
    
    - name: Pull frontend image from GHCR
      run: |
        echo "Pulling frontend image from GHCR..."
        docker pull ghcr.io/${{ github.repository }}/frontend:latest
    
    - name: Pull nginx image from GHCR
      run: |
        echo "Pulling nginx image from GHCR..."
        docker pull ghcr.io/${{ github.repository }}/nginx:latest
    
    - name: Test production stack
      env:
        BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:latest
        FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:latest
        NGINX_IMAGE: ghcr.io/${{ github.repository }}/nginx:latest
        DJANGO_SECRET_KEY: test-secret-key-for-ci
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        VITE_API_URL: http://localhost/api
      run: |
        # Start containers using production docker-compose file
        docker compose -f docker-compose.prod.yml up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to be ready..."
        sleep 15
        
        # Show container status
        docker compose -f docker-compose.prod.yml ps
        
        # Show backend logs
        echo "Backend logs:"
        docker compose -f docker-compose.prod.yml logs backend
        
        # Test backend health directly
        echo "Testing backend health..."
        docker compose -f docker-compose.prod.yml exec -T backend uv run python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')" || exit 1
        
        # Test through nginx
        echo "Testing through nginx..."
        curl -f http://localhost/api/players/ || exit 1
        
        echo "All health checks passed!"
        
        # Cleanup
        docker compose -f docker-compose.prod.yml down

