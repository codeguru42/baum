name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend development image
      run: |
        docker build -t baum-vibe-backend-dev:test -f backend/Dockerfile backend/
    
    - name: Run Django tests in container
      run: |
        docker run --rm baum-vibe-backend-dev:test python manage.py test
    
    - name: Run flake8 linting in container
      run: |
        docker run --rm baum-vibe-backend-dev:test sh -c "
          pip install flake8 && \
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics && \
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        "
      continue-on-error: true

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build frontend development image
      run: |
        docker build -t baum-vibe-frontend-dev:test -f frontend/Dockerfile frontend/
    
    - name: Run tests in container
      run: |
        docker run --rm -e CI=true baum-vibe-frontend-dev:test npm test -- --watchAll=false --coverage
    
    - name: Build frontend in container
      run: |
        docker run --rm baum-vibe-frontend-dev:test npm run build

  docker-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull or build backend image
      run: |
        if docker pull ghcr.io/${{ github.repository }}/backend:latest 2>/dev/null; then
          echo "Using pre-built backend image from GHCR"
          docker tag ghcr.io/${{ github.repository }}/backend:latest baum-vibe-backend:latest
        else
          echo "Pre-built image not found, building backend locally"
          docker build -t baum-vibe-backend:latest -f backend/Dockerfile.prod backend/
        fi
    
    - name: Pull or build frontend image
      run: |
        if docker pull ghcr.io/${{ github.repository }}/frontend:latest 2>/dev/null; then
          echo "Using pre-built frontend image from GHCR"
          docker tag ghcr.io/${{ github.repository }}/frontend:latest baum-vibe-frontend:latest
        else
          echo "Pre-built image not found, building frontend locally"
          docker build -t baum-vibe-frontend:latest \
            --build-arg REACT_APP_API_URL=http://localhost/api \
            -f frontend/Dockerfile.prod frontend/
        fi
    
    - name: Pull or build nginx image
      run: |
        if docker pull ghcr.io/${{ github.repository }}/nginx:latest 2>/dev/null; then
          echo "Using pre-built nginx image from GHCR"
          docker tag ghcr.io/${{ github.repository }}/nginx:latest baum-vibe-nginx:latest
        else
          echo "Pre-built image not found, using nginx:alpine"
          docker pull nginx:alpine
          docker tag nginx:alpine baum-vibe-nginx:latest
        fi
    
    - name: Test production stack
      run: |
        # Create a test docker-compose file using the pulled images
        cat > docker-compose.test.yml << 'EOF'
        services:
          backend:
            image: baum-vibe-backend:latest
            container_name: tournament-backend-test
            expose:
              - "8000"
            environment:
              - DJANGO_SETTINGS_MODULE=tournament_project.settings
              - DJANGO_SECRET_KEY=test-secret-key-for-ci
              - DJANGO_DEBUG=False
              - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
              - DATABASE_URL=sqlite:///db/db.sqlite3
            networks:
              - test-network
            healthcheck:
              test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')"]
              interval: 10s
              timeout: 5s
              retries: 5
              start_period: 20s
        
          frontend:
            image: baum-vibe-frontend:latest
            container_name: tournament-frontend-test
            expose:
              - "80"
            depends_on:
              - backend
            networks:
              - test-network
        
          nginx:
            image: baum-vibe-nginx:latest
            container_name: tournament-nginx-test
            ports:
              - "8080:80"
            volumes:
              - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
              - ./nginx/conf.d:/etc/nginx/conf.d:ro
            depends_on:
              - backend
              - frontend
            networks:
              - test-network
        
        networks:
          test-network:
            driver: bridge
        EOF
        
        # Start containers
        docker compose -f docker-compose.test.yml up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to be ready..."
        sleep 15
        
        # Show container status
        docker compose -f docker-compose.test.yml ps
        
        # Show backend logs
        echo "Backend logs:"
        docker compose -f docker-compose.test.yml logs backend
        
        # Test backend health directly
        echo "Testing backend health..."
        docker compose -f docker-compose.test.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')" || exit 1
        
        # Test through nginx
        echo "Testing through nginx..."
        curl -f http://localhost:8080/api/players/ || exit 1
        
        echo "All health checks passed!"
        
        # Cleanup
        docker compose -f docker-compose.test.yml down
    
    - name: Validate development environment
      run: |
        docker compose build
        docker compose up -d
        sleep 10
        
        # Test dev backend
        curl -f http://localhost:8000/api/players/ || exit 1
        
        # Test dev frontend
        curl -f http://localhost:3000/ || exit 1
        
        docker compose down

