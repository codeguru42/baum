name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only deploy if build-images workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Update app spec with repository info
      run: |
        sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" .do/app.yaml
        cat .do/app.yaml
    
    - name: Deploy to DigitalOcean App Platform
      uses: digitalocean/app_action/deploy@v2
      env:
        SAMPLE_DIGEST: ${{ github.sha }}
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Get deployment info
      id: deploy-info
      uses: digitalocean/app_action/deploy@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Deployment notification
      if: success()
      run: |
        echo "🚀 Deployment successful!"
        echo "Application URL: ${{ fromJson(steps.deploy-info.outputs.app).live_url }}"
        echo "App ID: ${{ fromJson(steps.deploy-info.outputs.app).id }}"
    
    - name: Deployment failed notification
      if: failure()
      run: |
        echo "⚠️ Deployment failed!"
        echo "Check the logs above for details."
        echo "Build logs: ${{ steps.deploy-info.outputs.build_logs }}"
        echo "Deploy logs: ${{ steps.deploy-info.outputs.deploy_logs }}"
