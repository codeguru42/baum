name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only deploy if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Update app spec with repository info
      run: |
        sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" .do/app.yaml
        cat .do/app.yaml
    
    - name: Extract app name from spec
      id: app-name
      run: |
        APP_NAME=$(grep "^name:" .do/app.yaml | head -n 1 | awk '{print $2}')
        echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "App name from spec: $APP_NAME"
    
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    
    - name: Check if app exists
      id: check-app
      run: |
        # Try to find existing app by name
        APP_NAME="${{ steps.app-name.outputs.app-name }}"
        echo "Checking for existing app: $APP_NAME"
        
        # Get list of apps and search for exact name match
        APP_LIST=$(doctl apps list --format ID,Spec.Name --no-header)
        
        if [ -z "$APP_LIST" ]; then
          echo "No apps found in account"
          echo "app-exists=false" >> $GITHUB_OUTPUT
        else
          # Look for exact match in the second column (name)
          APP_ID=$(echo "$APP_LIST" | awk -v name="$APP_NAME" '$2 == name {print $1}')
          
          if [ -n "$APP_ID" ]; then
            echo "app-exists=true" >> $GITHUB_OUTPUT
            echo "app-id=$APP_ID" >> $GITHUB_OUTPUT
            echo "✓ Found existing app: $APP_ID (name: $APP_NAME)"
          else
            echo "app-exists=false" >> $GITHUB_OUTPUT
            echo "ℹ No existing app found with name: $APP_NAME"
          fi
        fi
    
    - name: Install PyYAML for YAML generation
      if: steps.check-app.outputs.app-exists == 'false'
      run: pip install pyyaml
    
    - name: Inject secrets into app spec for new app creation
      if: steps.check-app.outputs.app-exists == 'false'
      run: |
        # Create a temporary file with secrets injected (only for new app creation)
        # Use Python to properly escape YAML values to avoid parsing errors with special characters
        python3 << 'PYTHON_EOF'
        import yaml
        import os
        import sys
        
        # Validate required secrets are present
        django_secret_key = os.environ.get('DJANGO_SECRET_KEY')
        django_allowed_hosts = os.environ.get('DJANGO_ALLOWED_HOSTS')
        github_repository = os.environ.get('GITHUB_REPOSITORY')
        
        if not django_secret_key:
            print("Error: DJANGO_SECRET_KEY secret is not set", file=sys.stderr)
            sys.exit(1)
        
        if not django_allowed_hosts:
            print("Error: DJANGO_ALLOWED_HOSTS secret is not set", file=sys.stderr)
            sys.exit(1)
        
        if not github_repository:
            print("Error: GITHUB_REPOSITORY is not set", file=sys.stderr)
            sys.exit(1)
        
        spec = {
            'name': 'baum-tournament',
            'region': 'nyc',
            'services': [
                {
                    'name': 'backend',
                    'image': {
                        'registry_type': 'GHCR',
                        'registry': 'ghcr.io',
                        'repository': f'{github_repository}/backend',
                        'tag': 'latest'
                    },
                    'envs': [
                        {'key': 'DJANGO_SETTINGS_MODULE', 'value': 'tournament_app.settings'},
                        {'key': 'DJANGO_SECRET_KEY', 'value': django_secret_key},
                        {'key': 'DJANGO_DEBUG', 'value': 'False'},
                        {'key': 'DJANGO_ALLOWED_HOSTS', 'value': django_allowed_hosts}
                    ],
                    'health_check': {
                        'http_path': '/api/players/',
                        'initial_delay_seconds': 40,
                        'period_seconds': 30,
                        'timeout_seconds': 10,
                        'success_threshold': 1,
                        'failure_threshold': 3
                    },
                    'http_port': 8000,
                    'instance_count': 1,
                    'instance_size_slug': 'basic-xxs',
                    'routes': [{'path': '/api'}]
                },
                {
                    'name': 'web',
                    'image': {
                        'registry_type': 'GHCR',
                        'registry': 'ghcr.io',
                        'repository': f'{github_repository}/nginx',
                        'tag': 'latest'
                    },
                    'envs': [
                        {'key': 'BACKEND_URL', 'value': 'http://backend:8000'}
                    ],
                    'http_port': 80,
                    'instance_count': 1,
                    'instance_size_slug': 'basic-xxs',
                    'routes': [{'path': '/'}]
                }
            ]
        }
        
        with open('.do/app-with-secrets.yaml', 'w', encoding='utf-8') as f:
            yaml.dump(spec, f, default_flow_style=False, sort_keys=False)
        PYTHON_EOF
        
        echo "✓ Generated app spec with secrets injected for new app creation"
      env:
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
        GITHUB_REPOSITORY: ${{ github.repository }}
    
    - name: Create new app
      id: create-app
      if: steps.check-app.outputs.app-exists == 'false'
      run: |
        echo "Creating new DigitalOcean App Platform app..."
        APP_ID=$(doctl apps create --spec .do/app-with-secrets.yaml --format ID --no-header)
        echo "app-id=$APP_ID" >> $GITHUB_OUTPUT
        echo "✓ Created new app with ID: $APP_ID"
    
    - name: Update existing app
      id: update-app
      if: steps.check-app.outputs.app-exists == 'true'
      run: |
        APP_ID="${{ steps.check-app.outputs.app-id }}"
        echo "Updating existing app: $APP_ID"
        echo "Note: Using regular app.yaml to preserve existing environment variables"
        doctl apps update $APP_ID --spec .do/app.yaml
        echo "app-id=$APP_ID" >> $GITHUB_OUTPUT
        echo "✓ Updated app: $APP_ID (environment variables unchanged)"
    
    - name: Set app ID for subsequent steps
      id: set-app-id
      run: |
        if [ "${{ steps.check-app.outputs.app-exists }}" == "true" ]; then
          echo "app-id=${{ steps.check-app.outputs.app-id }}" >> $GITHUB_OUTPUT
        else
          echo "app-id=${{ steps.create-app.outputs.app-id }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Wait for deployment
      run: |
        APP_ID="${{ steps.set-app-id.outputs.app-id }}"
        echo "Waiting for deployment to complete for app: $APP_ID"
        
        # Wait for deployment to complete (timeout after 15 minutes)
        TIMEOUT=900
        ELAPSED=0
        INTERVAL=30
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          # Get deployment status with error handling
          if ! DEPLOYMENT_OUTPUT=$(doctl apps list-deployments $APP_ID --format Phase --no-header 2>&1); then
            echo "Warning: Failed to get deployment status: $DEPLOYMENT_OUTPUT"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            continue
          fi
          
          if [ -z "$DEPLOYMENT_OUTPUT" ]; then
            echo "Warning: No deployments found yet, waiting..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            continue
          fi
          
          DEPLOYMENT_STATUS=$(echo "$DEPLOYMENT_OUTPUT" | head -n 1)
          echo "Deployment status: $DEPLOYMENT_STATUS (${ELAPSED}s elapsed)"
          
          if [ "$DEPLOYMENT_STATUS" == "ACTIVE" ]; then
            echo "✓ Deployment completed successfully!"
            break
          elif [ "$DEPLOYMENT_STATUS" == "ERROR" ] || [ "$DEPLOYMENT_STATUS" == "CANCELED" ]; then
            echo "✗ Deployment failed with status: $DEPLOYMENT_STATUS"
            echo "Fetching deployment logs..."
            doctl apps logs $APP_ID --type deploy || true
            exit 1
          fi
          
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "✗ Deployment timed out after ${TIMEOUT}s"
          echo "Last known status: $DEPLOYMENT_STATUS"
          exit 1
        fi
    
    - name: Get app info
      id: app-info
      run: |
        APP_ID="${{ steps.set-app-id.outputs.app-id }}"
        APP_URL=$(doctl apps get $APP_ID --format LiveURL --no-header)
        echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
        echo "app-id=$APP_ID" >> $GITHUB_OUTPUT
    
    - name: Deployment notification
      if: success()
      run: |
        if [ "${{ steps.check-app.outputs.app-exists }}" == "true" ]; then
          echo "🚀 App updated successfully!"
        else
          echo "🚀 New app created and deployed successfully!"
        fi
        echo "Application URL: ${{ steps.app-info.outputs.app-url }}"
        echo "App ID: ${{ steps.app-info.outputs.app-id }}"
    
    - name: Deployment failed notification
      if: failure()
      run: |
        echo "⚠️ Deployment failed!"
        echo "Check the logs above for details."

