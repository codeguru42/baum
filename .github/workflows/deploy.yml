name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only deploy if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Update app spec with repository info
      run: |
        sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" .do/app.yaml
        cat .do/app.yaml
    
    - name: Deploy to DigitalOcean App Platform
      id: deploy
      uses: digitalocean/app_action/deploy@v2
      env:
        SAMPLE_DIGEST: ${{ github.sha }}
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        app-spec-location: .do/app.yaml
    
    - name: Deployment notification
      if: success()
      run: |
        echo "🚀 Deployment successful!"
        echo "Application URL: ${{ steps.deploy.outputs.app_url }}"
    
    - name: Deployment failed notification
      if: failure()
      run: |
        echo "⚠️ Deployment failed!"
        echo "Check the logs above for details."
