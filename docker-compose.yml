services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tournament-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/db
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
    networks:
      - tournament-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/players/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tournament-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - tournament-network
    stdin_open: true
    tty: true

networks:
  tournament-network:
    driver: bridge

volumes:
  backend-data:
