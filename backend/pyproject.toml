[project]
name = "baum-tournament"
version = "0.1.0"
description = "Go tournament management system"
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.9",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.3.1",
    "envparse==0.2.0",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=21.2.0",
]
dev = [
    "flake8>=6.0.0",
]

[tool.uv]
dev-dependencies = [
    "flake8>=6.0.0",
]
